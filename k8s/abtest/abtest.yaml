apiVersion: v1
kind: Namespace
metadata:
  name: abtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
  namespace: abtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-a
  template:
    metadata:
      labels:
        app: aceest-a
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:1.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a
  namespace: abtest
spec:
  selector:
    app: aceest-a
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
  namespace: abtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-b
  template:
    metadata:
      labels:
        app: aceest-b
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b
  namespace: abtest
spec:
  selector:
    app: aceest-b
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-proxy-conf
  namespace: abtest
data:
  nginx.conf: |
    events {}
    http {
      access_log /dev/stdout;
      upstream version_a { server aceest-a.abtest.svc.cluster.local:5000; }
      upstream version_b { server aceest-b.abtest.svc.cluster.local:5000; }
      map $http_x_variant $backend {
        default version_a;
        "B"     version_b;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://$backend;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-proxy
  namespace: abtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ab-proxy
  template:
    metadata:
      labels:
        app: ab-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: conf
          configMap:
            name: ab-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: ab-proxy
  namespace: abtest
spec:
  type: NodePort
  selector:
    app: ab-proxy
  ports:
    - port: 80
      targetPort: 80
