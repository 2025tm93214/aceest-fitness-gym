apiVersion: v1
kind: Namespace
metadata:
  name: shadow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-v1
  namespace: shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-v1
  template:
    metadata:
      labels:
        app: aceest-v1
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:1.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-v1
  namespace: shadow
spec:
  selector:
    app: aceest-v1
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-v2
  namespace: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-v2
  template:
    metadata:
      labels:
        app: aceest-v2
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-v2
  namespace: shadow
spec:
  selector:
    app: aceest-v2
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-proxy-conf
  namespace: shadow
data:
  nginx.conf: |
    events {}
    http {
      log_format shadowlog '$uri upstream=$upstream_addr status=$status';
      access_log /dev/stdout shadowlog;
      log_subrequest on;
      upstream primary { server aceest-v1.shadow.svc.cluster.local:5000; }
      upstream shadow  { server aceest-v2.shadow.svc.cluster.local:5000; }
      server {
        listen 80;
        location / {
          mirror /mirror;
          mirror_request_body on;
          proxy_pass http://primary;
        }
        location = /mirror {
          internal;
          proxy_pass http://shadow$request_uri;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-proxy
  namespace: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shadow-proxy
  template:
    metadata:
      labels:
        app: shadow-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: conf
          configMap:
            name: shadow-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-proxy
  namespace: shadow
spec:
  type: NodePort
  selector:
    app: shadow-proxy
  ports:
    - port: 80
      targetPort: 80
