apiVersion: v1
kind: Namespace
metadata:
  name: canary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: canary
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest
      track: stable
  template:
    metadata:
      labels:
        app: aceest
        track: stable
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:1.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
  namespace: canary
spec:
  type: NodePort
  selector:
    app: aceest
  ports:
    - port: 5000
      targetPort: 5000
