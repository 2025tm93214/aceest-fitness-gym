apiVersion: v1
kind: Namespace
metadata:
  name: bluegreen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: bluegreen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      slot: blue
  template:
    metadata:
      labels:
        app: aceest
        slot: blue
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:1.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: bluegreen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      slot: green
  template:
    metadata:
      labels:
        app: aceest
        slot: green
    spec:
      containers:
        - name: app
          image: 2025tm93214/aceest-fitness:2.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg
  namespace: bluegreen
spec:
  type: NodePort
  selector:
    app: aceest
    slot: blue
  ports:
    - port: 5000
      targetPort: 5000
