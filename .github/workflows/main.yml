name: ACEest CI

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (compile all sources)
        run: python -m compileall -q app.py tests

      - name: Lint with flake8
        run: flake8 .

  docker-test:
    name: Docker Build & Test
    runs-on: ubuntu-24.04
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:${{ github.sha }} pytest -v
